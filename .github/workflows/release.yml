name: Release

# Pushing a tag such as v1.2.3 builds the installer and publishes it as a GitHub release.
# WinStart's built-in updater picks the release up from there.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check that the tag matches the project version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = ([string]($props.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1)).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag '$env:GITHUB_REF_NAME' does not match <Version>$version</Version> in Directory.Build.props. Update the version (and CHANGELOG.md), commit, and tag that commit as v$version."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: ./build/release-notes.ps1 -Version $env:VERSION -OutFile release-notes.md

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress --yes
          }

      - name: Build, test and package
        shell: pwsh
        run: ./build/build.ps1

      # Code signing would go here (see README, "Code signing"). Never commit certificates;
      # use repository secrets or a cloud signing service.

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "artifacts/WinStart-Setup-$($env:VERSION).exe"
          $options = @('--title', "WinStart $($env:VERSION)", '--notes-file', 'release-notes.md', '--verify-tag')
          # Versions like 1.3.0-beta.1 are published as pre-releases, which the updater does not offer.
          if ($env:VERSION -match '-') { $options += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME $installer 'artifacts/SHA256SUMS.txt' @options
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed (exit code $LASTEXITCODE)." }
